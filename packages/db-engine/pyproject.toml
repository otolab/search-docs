[project]
name = "search-docs-db-engine"
version = "0.1.0"
description = "search-docs LanceDB Vector検索エンジン"
requires-python = ">=3.11,<3.14"
dependencies = [
    "lancedb==0.30.2",
    "pylance==0.39.0",
    "pyarrow==22.0.0",
    "pandas==2.3.3",
    "numpy==2.3.5",
    "onnxruntime==1.25.1",
    "transformers==4.57.1",
    "huggingface-hub==0.36.0",
    "protobuf==6.33.1",
    "sentencepiece==0.2.1",
    "pytest==9.0.1",
    "psutil==7.1.3",
]

[project.optional-dependencies]
# GPU版（ONNX Runtime + CUDA）
gpu = [
    "onnxruntime-gpu>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python"]
