[project]
name = "search-docs"
version = "0.1.0"
description = "🐕️ ローカル文書検索システム - Markdown文書に対するVector検索機能を提供"
requires-python = ">=3.11,<3.14"
dependencies = [
    "lancedb>=0.5.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "protobuf>=4.0.0",
    "sentencepiece>=0.1.99",
    "pytest>=7.0.0",
    "psutil>=5.9.0",
    "duckdb>=0.9.0",
]
