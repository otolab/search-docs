name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project packages/db-engine

      - name: Build
        run: pnpm build

      - name: Verify host procfs denial fails closed
        run: |
          CI_PROJECT_PREFIX="$GITHUB_WORKSPACE/packages/db-engine/.venv" \
          CI_PYTHON_LOCATION="$pythonLocation" \
            uv run --project packages/db-engine --offline --no-sync python \
            packages/db-engine/src/python/tests/embedding_supervisor_ci_preflight.py \
            host-negative

      - name: Verify isolated Linux embedding supervisor prototype in a private PID namespace
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          if [[ "$runner_uid" == 0 ]]; then
            echo "The private PID namespace test must run as the non-root runner UID." >&2
            exit 1
          fi

          . /etc/os-release
          if [[ "$ID" != ubuntu ]]; then
            echo "Expected an Ubuntu host runner; got $ID." >&2
            exit 1
          fi
          container_image="ubuntu:$VERSION_ID"

          uv_real="$(readlink -f "$(command -v uv)")"
          uv_directory="$(dirname "$uv_real")"
          node_real="$(readlink -f "$(command -v node)")"
          node_root="$(dirname "$(dirname "$node_real")")"
          host_libffi="$(readlink -f /usr/lib/x86_64-linux-gnu/libffi.so.8)"
          if [[ ! -f "$host_libffi" ]]; then
            echo "The runner's libffi.so.8 could not be resolved." >&2
            exit 1
          fi
          host_pid_namespace_inode="$(stat -Lc '%i' /proc/self/ns/pid)"

          docker run --rm \
            --pull=missing \
            --user "$runner_uid:$runner_gid" \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 512 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=$GITHUB_WORKSPACE,readonly" \
            --tmpfs "$GITHUB_WORKSPACE/.git:rw,nosuid,nodev,noexec,size=16m,mode=755" \
            --mount "type=bind,src=$pythonLocation,dst=$pythonLocation,readonly" \
            --mount "type=bind,src=$uv_directory,dst=/ci-toolchain/uv,readonly" \
            --mount "type=bind,src=$node_root,dst=/ci-toolchain/node,readonly" \
            --mount "type=bind,src=$host_libffi,dst=/usr/lib/x86_64-linux-gnu/libffi.so.8,readonly" \
            -e "PATH=/ci-toolchain/uv:/ci-toolchain/node/bin:$pythonLocation/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -e "LD_LIBRARY_PATH=$pythonLocation/lib" \
            -e "HOME=/tmp/issue168-home" \
            -e "TMPDIR=/tmp" \
            -e "UV_CACHE_DIR=/tmp/uv-cache" \
            -e "UV_OFFLINE=1" \
            -e "UV_PYTHON_DOWNLOADS=never" \
            -e "PYTHONDONTWRITEBYTECODE=1" \
            -e "PYTHONNOUSERSITE=1" \
            -e "CI_WORKSPACE=$GITHUB_WORKSPACE" \
            -e "CI_PROJECT_PREFIX=$GITHUB_WORKSPACE/packages/db-engine/.venv" \
            -e "CI_PYTHON_LOCATION=$pythonLocation" \
            -e "CI_EXPECTED_UID=$runner_uid" \
            -e "CI_EXPECTED_GID=$runner_gid" \
            -e "CI_EXPECTED_OS_VERSION=$VERSION_ID" \
            -e "CI_HOST_PID_NAMESPACE_INODE=$host_pid_namespace_inode" \
            "$container_image" \
            /bin/bash -euo pipefail -c '
              mkdir -p "$HOME" "$UV_CACHE_DIR"
              cd "$CI_WORKSPACE"
              "$CI_PROJECT_PREFIX/bin/python" \
                "$CI_WORKSPACE/packages/db-engine/src/python/tests/embedding_supervisor_ci_preflight.py" \
                private-container
              "$CI_PROJECT_PREFIX/bin/python" -m unittest discover \
                -s packages/db-engine/src/python/tests \
                -t packages/db-engine/src/python/tests \
                -p test_embedding_supervisor_prototype_stdlib.py -v
              "$CI_PROJECT_PREFIX/bin/python" \
                packages/cli/scripts/test-embedding-supervisor-prototype-cli.py
            '

      - name: Verify prototype is absent from product paths and npm packages
        run: |
          pnpm --dir packages/cli pack --pack-destination "$RUNNER_TEMP"
          pnpm --dir packages/db-engine pack --pack-destination "$RUNNER_TEMP"
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib
          import sys
          import tarfile

          artifact_dir = pathlib.Path(sys.argv[1])
          cli_tarball = next(artifact_dir.glob("search-docs-cli-*.tgz"))
          db_tarball = next(artifact_dir.glob("search-docs-db-engine-*.tgz"))
          markers = (
              b"managed_supervisor_prototype",
              b"embedding_supervisor_state",
              b"embedding_linux_pidfd",
              b"issue168-experimental-supervisor-cli",
              b"SEARCH_DOCS_TEST_",
              b"SEARCH_DOCS_EXPERIMENTAL_EMBEDDING_SUPERVISOR",
          )

          def inspect_tarball(path, package):
              with tarfile.open(path) as archive:
                  names = archive.getnames()
                  for name in names:
                      normalized = name.lstrip("./")
                      if package == "db-engine":
                          assert "/src/python/experiments/" not in f"/{normalized}", name
                          assert "/src/python/tests/" not in f"/{normalized}", name
                          assert not normalized.endswith("/embedding_linux_pidfd.py"), name
                      else:
                          assert "/scripts/" not in f"/{normalized}", name
                      if not normalized.endswith((".js", ".py", ".json")):
                          continue
                      content = archive.extractfile(name).read()
                      assert not any(marker in content for marker in markers), name

          inspect_tarball(cli_tarball, "cli")
          inspect_tarball(db_tarball, "db-engine")

          source_roots = (
              pathlib.Path("packages/cli/src"),
              pathlib.Path("packages/db-engine/src"),
          )
          excluded = {"experiments", "tests", "__tests__", "__pycache__"}
          for root in source_roots:
              for source in root.rglob("*"):
                  if not source.is_file() or excluded.intersection(source.parts):
                      continue
                  if source.suffix not in {".js", ".py", ".ts"}:
                      continue
                  content = source.read_bytes()
                  assert not any(marker in content for marker in markers), source
          PY

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Embedding startup process regression tests
        run: |
          python3 packages/cli/scripts/test-embedding-interruption.py
          python3 packages/cli/scripts/test-embedding-lifecycle.py

      - name: DB maintenance regression tests
        run: pnpm --filter @search-docs/db-engine exec vitest run --config vitest.config.maintenance.ts

      - name: MCP maintenance regression tests
        run: pnpm --filter @search-docs/mcp-server exec vitest run --config vitest.config.maintenance.ts

  heartbeat-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project packages/db-engine

      - name: Build
        run: pnpm build

      - name: Heartbeat timezone tests
        run: uv run --project packages/db-engine python -m pytest packages/db-engine/src/python/__tests__/test_heartbeat_timezone.py packages/db-engine/src/python/__tests__/test_duplicate_diagnostics.py -q

      - name: Heartbeat integration test
        run: pnpm --filter @search-docs/server test:heartbeat-integration

      - name: OpenAI-compatible Python tests
        run: PYTHONPATH=packages/db-engine/src/python uv run --project packages/db-engine python -m pytest packages/db-engine/src/python/__tests__/test_openai_embedding.py -q

      - name: OpenAI-compatible integration test
        run: pnpm --filter @search-docs/server exec vitest run --config vitest.config.embedding-integration.ts
