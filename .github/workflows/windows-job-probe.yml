name: Windows Job Object probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-job-probe.yml'
      - 'packages/db-engine/src/python/tests/test_embedding_windows_job_stdlib.py'
  workflow_dispatch:

jobs:
  windows-job-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Windows Job Object creation and supervisor cleanup
        run: python -m unittest discover -s packages/db-engine/src/python/tests -p test_embedding_windows_job_stdlib.py -v
